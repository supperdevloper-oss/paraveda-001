<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1e35">
<title>Performance — Paraveda CRM</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="pv-icon-192.png">
<style>
:root{
  --bg:#eef1f5; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e5e7eb;
  --navy:#0f1e35; --navy-2:#152a47; --soft:#f8fafc;
  --green:#16a34a; --green-soft:#dcfce7; --red:#dc2626; --red-soft:#fee2e2;
  --amber:#d97706; --amber-soft:#fef3c7; --blue:#2563eb; --blue-soft:#dbeafe;
  --violet:#7c3aed; --violet-soft:#ede9fe; --teal:#0d9488;
  --shadow:0 1px 2px rgba(15,23,42,.05), 0 8px 24px -16px rgba(15,23,42,.25);
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Arabic",sans-serif;
  -webkit-font-smoothing:antialiased;
}
body.embedded{padding-bottom:40px}
a{color:inherit}
.wrap{max-width:1560px;margin:0 auto;padding:20px 22px 60px}
.hide{display:none !important}

/* ── header ─────────────────────────────────────────────── */
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-size:26px;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.head .sub{color:var(--muted);font-size:12.5px;margin:0}
.head .who{color:var(--muted);font-size:11.5px;margin-top:2px}
.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;box-shadow:var(--shadow)}
.seg button{
  border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:12px;
  padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;
}
.seg button:hover{background:var(--soft);color:var(--text)}
.seg button.on{background:var(--navy);color:#fff}
.sel,.inp{
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--text);
  font:inherit;font-size:12px;font-weight:600;box-shadow:var(--shadow);outline:none;min-height:38px;
}
.sel:focus,.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.btn{
  display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:8px 12px;font:inherit;font-weight:700;font-size:12px;color:var(--text);
  cursor:pointer;box-shadow:var(--shadow);
}
.btn:hover{border-color:#cbd5e1}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.ghost{background:transparent;box-shadow:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--muted);
  background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}

/* ── cards & sections ───────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sec{margin-top:16px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 8px}
.sec-title{font-size:15.5px;font-weight:800;margin:0}
.sec-sub{color:var(--muted);font-size:11.5px;margin:2px 0 0}
.banner{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--navy);color:#fff;border-radius:14px 14px 0 0;padding:12px 16px;
}
.banner .t{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}
.banner .s{font-size:11px;opacity:.7;margin-top:2px}
.banner .ico{
  width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.12);
  display:grid;place-items:center;font-size:14px;
}
.banner + .card-body{border-radius:0 0 var(--r) var(--r)}

/* ── KPI ────────────────────────────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(188px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .lab{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .val{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums;
  display:flex;align-items:baseline;gap:6px;flex-wrap:nowrap;white-space:nowrap}
.kpi.money .val{font-size:16.5px}
.kpi .val .txt{overflow:hidden;text-overflow:ellipsis}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:2px}
.kpi .bar{height:4px;border-radius:99px;background:var(--line);margin-top:9px;overflow:hidden}
.kpi .bar i{display:block;height:100%;border-radius:99px;background:var(--blue)}
.kpi.green .val{color:var(--green)} .kpi.green .bar i{background:var(--green)}
.kpi.red .val{color:var(--red)} .kpi.red .bar i{background:var(--red)}
.kpi.amber .val{color:var(--amber)} .kpi.amber .bar i{background:var(--amber)}
.kpi.blue .val{color:var(--blue)} .kpi.blue .bar i{background:var(--blue)}
.kpi.violet .val{color:var(--violet)} .kpi.violet .bar i{background:var(--violet)}
.kpi.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.kpi.navy .lab,.kpi.navy .sub{color:rgba(255,255,255,.66)}
.delta{font-size:10px;font-weight:800;padding:2px 5px;border-radius:6px;flex:0 0 auto}
.delta.up{color:var(--green);background:var(--green-soft)}
.delta.dn{color:var(--red);background:var(--red-soft)}

/* ── agent cards ────────────────────────────────────────── */
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.ag{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.ag-top{display:flex;align-items:flex-start;gap:10px}
.rank{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;
  background:var(--amber-soft);color:#92400e;flex:0 0 auto;
}
.rank.r1{background:#fde68a;color:#78350f}
.ag-name{font-weight:800;font-size:14px;line-height:1.2}
.ag-meta{font-size:10.5px;color:var(--muted);margin-top:1px}
.ag-rev{margin-left:auto;text-align:right}
.ag-rev .l{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}
.ag-rev .v{font-weight:800;font-size:13px}
.rates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
.rate{background:var(--soft);border-radius:10px;padding:8px 10px;border:1px solid var(--line)}
.rate .l{font-size:10px;font-weight:800;color:var(--muted)}
.rate .v{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:1px}
.rate.green .v{color:var(--green)} .rate.blue .v{color:var(--blue)}
.rate .bar{height:4px;border-radius:99px;background:#e2e8f0;margin-top:6px;overflow:hidden}
.rate .bar i{display:block;height:100%;border-radius:99px}
.rate.green .bar i{background:var(--green)} .rate.blue .bar i{background:var(--blue)}
.grp-lab{font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:7px 6px;text-align:center}
.tile b{display:block;font-size:16px;font-weight:800;line-height:1.1}
.tile span{font-size:9px;color:var(--muted);font-weight:700}
.tile.g b{color:var(--green)} .tile.r b{color:var(--red)} .tile.a b{color:var(--amber)}
.tile.b b{color:var(--blue)} .tile.v b{color:var(--violet)} .tile.t b{color:var(--teal)}
.ag-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:10.5px;color:var(--muted)}
.tag{font-weight:800;font-size:10px;padding:2px 7px;border-radius:999px}
.tag.ok{background:var(--green-soft);color:#166534} .tag.mid{background:var(--amber-soft);color:#92400e}
.tag.bad{background:var(--red-soft);color:#991b1b}

/* ── tables ─────────────────────────────────────────────── */
.tw{overflow:auto;border-radius:12px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:12px}
thead th{
  position:sticky;top:0;background:var(--navy);color:#fff;text-align:left;padding:9px 10px;font-size:10px;
  text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;z-index:2;font-weight:800;
}
tbody td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}
.name{font-weight:700}
.mini{height:5px;border-radius:99px;background:#e2e8f0;overflow:hidden;min-width:54px}
.mini i{display:block;height:100%;border-radius:99px;background:var(--green)}
.badge{display:inline-block;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:800}
.badge.ok{background:var(--green-soft);color:#166534}
.badge.mid{background:var(--amber-soft);color:#92400e}
.badge.bad{background:var(--red-soft);color:#991b1b}
.badge.info{background:var(--blue-soft);color:#1e40af}

/* ── charts ─────────────────────────────────────────────── */
.chart{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.chart h3{margin:0 0 2px;font-size:13.5px;font-weight:800}
.chart p{margin:0 0 10px;font-size:11px;color:var(--muted)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--muted);font-weight:700}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:1050px){.grid2,.grid3{grid-template-columns:1fr}}

/* ── funnel ─────────────────────────────────────────────── */
.funnel{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fstep{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;position:relative;box-shadow:var(--shadow)}
.fstep .l{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.fstep .v{font-size:26px;font-weight:800;letter-spacing:-.02em}
.fstep .b{height:5px;border-radius:99px;background:#e2e8f0;margin-top:8px;overflow:hidden}
.fstep .b i{display:block;height:100%;border-radius:99px;background:var(--navy)}
.fstep .p{font-size:10.5px;color:var(--muted);margin-top:5px;font-weight:700}
@media(max-width:900px){.funnel{grid-template-columns:1fr 1fr}}

/* ── empty / loader ─────────────────────────────────────── */
.empty{padding:26px;text-align:center;color:var(--muted);font-size:12.5px}
.loader{padding:60px 20px;text-align:center;color:var(--muted)}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;
  margin:0 auto 10px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.note{font-size:10.5px;color:var(--muted);margin-top:7px}
.err{background:var(--red-soft);color:#991b1b;border:1px solid #fecaca;border-radius:10px;padding:10px 12px;font-size:12px}
</style>

var os=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
if(t==='dark'){document.documentElement.setAttribute('data-pv-theme','dark');}
}catch(e){}})();</script>

<body>
<div class="wrap">

  <div class="head">
    <div>
      <h1>Performance</h1>
      <p class="sub">Bilan des agentes, des produits et des ventes — calculé à partir des commandes réelles du CRM.</p>
      <div class="who" id="who"></div>
    </div>
    <div class="toolbar">
      <div class="seg" id="periods">
        <button data-p="today">Aujourd'hui</button>
        <button data-p="yesterday">Hier</button>
        <button data-p="7d">7 jours</button>
        <button data-p="30d">30 jours</button>
        <button data-p="month">Ce mois</button>
        <button data-p="all">Tout</button>
      </div>
      <span class="sel" id="customWrap" style="display:none">
        <input class="inp" type="date" id="from" style="border:0;box-shadow:none;padding:2px 4px">
        <input class="inp" type="date" id="to" style="border:0;box-shadow:none;padding:2px 4px">
      </span>
      <select class="sel" id="agentSel"><option value="">Toutes les agentes</option></select>
      <select class="sel" id="productSel"><option value="">Tous les produits</option></select>
      <button class="btn" id="refresh" title="Recharger les données">⟳ Actualiser</button>
      <button class="btn primary" id="export">⤓ Export CSV</button>
    </div>
  </div>

  <div id="status" class="pill" style="margin-bottom:12px"><span class="dot"></span><span id="statusTxt">Chargement…</span></div>

  <div id="app">
    <div class="loader"><div class="spin"></div>Chargement des données…</div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   Paraveda CRM — Page Performance
   كل الأرقام محسوبة من paraveda_orders_v5 (+ villes, commissions, adspend)
   ───────────────────────────────────────────────────────────────────────── */
(function () {
  'use strict';

  var TOKEN = '8c907fc0f4ffe0b9775a6b7c3c0fc7700e5724c0d78343df';
  var API = 'api.php';
  var EMBED = new URLSearchParams(location.search).get('embed') === '1';
  if (EMBED) document.body.classList.add('embedded');

  var $ = function (id) { return document.getElementById(id); };
  var RAW = { orders: [], villes: {}, spend: [], users: [] };
  var STATE = { period: '30d', from: '', to: '', agent: '', product: '' };
  var actor = null;

  /* ── أدوات ─────────────────────────────────────────────────────────── */
  function session() {
    try {
      var id = localStorage.getItem('paraveda_session_v1');
      var users = JSON.parse(localStorage.getItem('paraveda_users_v1') || '[]');
      var u = users.find(function (x) { return String(x.id) === String(id) && !x._del; });
      if (!u) return null;
      return { id: String(u.id), name: u.username || u.agent || 'Utilisateur', role: u.role || 'user' };
    } catch (e) { return null; }
  }
  function num(v) { var n = parseFloat(v); return isFinite(n) ? n : 0; }
  function nf(n) { return (Math.round(n * 100) / 100).toLocaleString('fr-FR').replace(/\u202f|\u00a0/g, ' '); }
  function money(n) { return nf(Math.round(n)) + ' MAD'; }
  function pct(a, b) { return b > 0 ? (a / b) * 100 : 0; }
  function p1(n) { return (Math.round(n * 10) / 10).toFixed(1) + '%'; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function d2(n) { return n < 10 ? '0' + n : '' + n; }
  function iso(d) { return d.getFullYear() + '-' + d2(d.getMonth() + 1) + '-' + d2(d.getDate()); }
  function parseDay(s) { var p = String(s || '').slice(0, 10).split('-'); return (p.length === 3) ? new Date(+p[0], +p[1] - 1, +p[2]) : null; }
  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }

  /* ── حدود الفترة ───────────────────────────────────────────────────── */
  function range() {
    var t = today(), from, to;
    switch (STATE.period) {
      case 'today': from = to = t; break;
      case 'yesterday': from = to = addDays(t, -1); break;
      case '7d': to = t; from = addDays(t, -6); break;
      case '30d': to = t; from = addDays(t, -29); break;
      case 'month': to = t; from = new Date(t.getFullYear(), t.getMonth(), 1); break;
      case 'custom':
        from = STATE.from ? parseDay(STATE.from) : addDays(t, -29);
        to = STATE.to ? parseDay(STATE.to) : t;
        if (from > to) { var x = from; from = to; to = x; }
        break;
      default: return { from: null, to: null, key: 'all' };
    }
    return { from: from, to: to, key: STATE.period };
  }
  function prevRange(r) {
    if (!r.from) return null;
    var days = Math.round((r.to - r.from) / 86400000) + 1;
    return { from: addDays(r.from, -days), to: addDays(r.to, -1) };
  }
  function inRange(dayStr, r) {
    if (!r.from) return true;
    var d = parseDay(dayStr);
    if (!d) return false;
    return d >= r.from && d <= r.to;
  }

  /* ── تحميل ─────────────────────────────────────────────────────────── */
  async function load() {
    var r = await fetch(API + '?t=' + Date.now() + '&token=' + encodeURIComponent(TOKEN), {
      cache: 'no-store', headers: { 'X-Sync-Token': TOKEN }
    });
    if (!r.ok) throw new Error('api.php → HTTP ' + r.status);
    var snap = await r.json();
    var g = function (k) { return snap[k] && snap[k].d; };

    RAW.orders = (g('paraveda_orders_v5') || []).map(function (o) { return o || {}; });
    var villes = g('paraveda_villes_v2') || [];
    RAW.villes = {};
    villes.forEach(function (v) { if (v && v.nom) RAW.villes[String(v.nom).trim().toLowerCase()] = num(v.prix); });
    RAW.spend = g('paraveda_adspend_v1') || [];
    RAW.users = g('paraveda_users_v1') || [];
    REDRAW();
  }

  /* ── تجميع ─────────────────────────────────────────────────────────── */
  function isConfirmed(o) { return o.statut === 'Confirmé'; }
  function isCancelled(o) { return o.statut === 'Annulé'; }
  function callTries(o) { var m = /^Appel-(\d+)$/.exec(String(o.statut || '').trim()); return m ? +m[1] : 0; }
  function isDelivered(o) { return o.livraison === 'Livrée'; }
  function isReturned(o) { return o.livraison === 'Retour' || o.livraison === 'Remboursé'; }
  function isShipped(o) { return isDelivered(o) || isReturned(o) || o.livraison === 'Expédier vers' || o.livraison === 'Expédié' || o.livraison === 'Rechange'; }
  function revenue(o) { return num(o.prix) * (num(o.qte) || 1); }
  function shipCost(o) {
    var c = RAW.villes[String(o.ville || '').trim().toLowerCase()];
    return typeof c === 'number' ? c : 0;
  }
  function agentKey(o) { return String(o.agent || '').trim() || 'Sans agente'; }
  function productKey(o) { return String(o.produit || '').trim() || '—'; }

  function filtered() {
    var r = range();
    var out = RAW.orders.filter(function (o) {
      if (!inRange(o.dateCreation, r)) return false;
      if (STATE.agent && agentKey(o) !== STATE.agent) return false;
      if (STATE.product && productKey(o) !== STATE.product) return false;
      return true;
    });
    return { rows: out, range: r };
  }

  function stats(rows) {
    var s = {
      n: rows.length, confirmed: 0, cancelled: 0, neww: 0, tries: 0,
      shipped: 0, delivered: 0, returned: 0, rev: 0, commission: 0, ship: 0,
      upsellOrders: 0, upsellQty: 0, basket: 0
    };
    rows.forEach(function (o) {
      if (isConfirmed(o)) s.confirmed++;
      else if (isCancelled(o)) s.cancelled++;
      else if (callTries(o)) s.tries += callTries(o);
      else if (!o.statut) s.neww++;
      if (isShipped(o)) s.shipped++;
      if (isDelivered(o)) {
        s.delivered++;
        s.rev += revenue(o);
        s.commission += num(o.commission);
        s.ship += shipCost(o);
      }
      if (isReturned(o)) s.returned++;
      if (num(o.upsell) > 0) { s.upsellOrders++; s.upsellQty += num(o.upsell); }
    });
    s.basket = s.delivered ? s.rev / s.delivered : 0;
    s.rateConf = pct(s.confirmed, s.n);
    s.rateDeliv = pct(s.delivered, s.confirmed || s.shipped);
    s.rateReturn = pct(s.returned, s.delivered + s.returned);
    s.margin = s.rev - s.ship - s.commission;
    return s;
  }

  function spendIn(r) {
    var sum = 0, n = 0;
    RAW.spend.forEach(function (x) {
      var day = String(x.date || '').slice(0, 10);
      if (!inRange(day, r)) return;
      if (STATE.agent && String(x.agent || '').trim() !== STATE.agent) return;
      if (STATE.product && String(x.produit || '').trim() !== STATE.product) return;
      sum += num(x.amount); n++;
    });
    return { amount: sum, n: n };
  }

  function groupBy(rows, keyFn) {
    var m = new Map();
    rows.forEach(function (o) {
      var k = keyFn(o);
      if (!m.has(k)) m.set(k, []);
      m.get(k).push(o);
    });
    return m;
  }

  /* ── رسم بياني SVG ─────────────────────────────────────────────────── */
  function lineChart(series, opts) {
    opts = opts || {};
    var W = 1000, H = opts.h || 220, pad = { l: 44, r: 12, t: 12, b: 26 };
    var labels = opts.labels || [];
    var max = 0;
    series.forEach(function (s) { s.points.forEach(function (v) { if (v > max) max = v; }); });
    max = max || 1;
    var nice = Math.pow(10, Math.floor(Math.log10(max)));
    var step = nice;
    var top = Math.ceil(max / step) * step;
    if (top / step < 3) { step = step / 2; top = Math.ceil(max / step) * step; }
    var iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
    var n = Math.max(1, (series[0] ? series[0].points.length : 1) - 1);
    var x = function (i) { return pad.l + (n ? (i / n) * iw : 0); };
    var y = function (v) { return pad.t + ih - (v / top) * ih; };

    var g = '';
    for (var v = 0; v <= top + 0.001; v += step) {
      g += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="currentColor" stroke-opacity=".10" stroke-dasharray="3 4"/>';
      g += '<text x="' + (pad.l - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="10" fill="currentColor" fill-opacity=".45">' + nf(Math.round(v)) + '</text>';
    }
    labels.forEach(function (lb, i) {
      if (labels.length > 12 && i % Math.ceil(labels.length / 10) !== 0) return;
      g += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" fill="currentColor" fill-opacity=".45">' + esc(lb) + '</text>';
    });
    series.forEach(function (s) {
      var d = '', area = '';
      s.points.forEach(function (v, i) {
        d += (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' ';
      });
      s.points.forEach(function (v, i) { area += (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' '; });
      area += 'L' + x(s.points.length - 1).toFixed(1) + ' ' + (pad.t + ih) + ' L' + x(0).toFixed(1) + ' ' + (pad.t + ih) + ' Z';
      if (s.fill) g += '<path d="' + area + '" fill="' + s.color + '" fill-opacity=".10"/>';
      g += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
      s.points.forEach(function (v, i) {
        if (s.points.length <= 40) g += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(v).toFixed(1) + '" r="2.6" fill="' + s.color + '"/>';
      });
    });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto">' + g + '</svg>';
  }

  function barChart(items, opts) {
    opts = opts || {};
    var W = 1000, H = opts.h || 240, pad = { l: 46, r: 12, t: 14, b: 46 };
    var max = Math.max.apply(null, items.map(function (i) { return i.value; }).concat([1]));
    var iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
    var bw = Math.min(52, (iw / Math.max(items.length, 1)) * 0.55);
    var gap = (iw - bw * items.length) / Math.max(items.length - 1, 1);
    var g = '';
    for (var k = 0; k <= 4; k++) {
      var v = (max / 4) * k, yy = pad.t + ih - (v / max) * ih;
      g += '<line x1="' + pad.l + '" x2="' + (W - pad.r) + '" y1="' + yy + '" y2="' + yy + '" stroke="currentColor" stroke-opacity=".10" stroke-dasharray="3 4"/>';
      g += '<text x="' + (pad.l - 8) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="10" fill="currentColor" fill-opacity=".45">' + nf(Math.round(v)) + '</text>';
    }
    items.forEach(function (it, i) {
      var x = pad.l + i * (bw + gap);
      var h = (it.value / max) * ih;
      g += '<rect x="' + x.toFixed(1) + '" y="' + (pad.t + ih - h).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(h, 1).toFixed(1) + '" rx="4" fill="' + (it.color || '#16a34a') + '"/>';
      g += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (pad.t + ih + 14) + '" text-anchor="middle" font-size="10" fill="currentColor" fill-opacity=".6">' + esc(it.label).slice(0, 14) + '</text>';
      g += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor" fill-opacity=".75">' + esc(it.sub || '') + '</text>';
    });
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto">' + g + '</svg>';
  }

  function hbar(items, color) {
    var max = Math.max.apply(null, items.map(function (i) { return i.value; }).concat([1]));
    return items.map(function (it) {
      var w = Math.max(2, (it.value / max) * 100);
      return '<div style="margin-bottom:9px">' +
        '<div style="display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px">' +
        '<span style="font-weight:700">' + esc(it.label) + '</span>' +
        '<span style="color:var(--muted);font-variant-numeric:tabular-nums">' + esc(it.sub || '') + '</span></div>' +
        '<div style="height:8px;border-radius:99px;background:var(--line);overflow:hidden">' +
        '<i style="display:block;height:100%;width:' + w.toFixed(1) + '%;border-radius:99px;background:' + (it.color || color || 'var(--blue)') + '"></i></div>' +
        '</div>';
    }).join('');
  }

  /* ── بطاقة بنت ─────────────────────────────────────────────────────── */

  /* ── عرض ───────────────────────────────────────────────────────────── */
  function REDRAW() {
    var f = filtered(), rows = f.rows, r = f.range, st = stats(rows);
    var prev = prevRange(r);
    var pst = prev ? stats(RAW.orders.filter(function (o) {
      if (!inRange(o.dateCreation, prev)) return false;
      if (STATE.agent && agentKey(o) !== STATE.agent) return false;
      if (STATE.product && productKey(o) !== STATE.product) return false;
      return true;
    })) : null;
    var spend = spendIn(r);

    /* سلاسل زمنية */
    var byDay = new Map();
    rows.forEach(function (o) {
      var d = String(o.dateCreation || '').slice(0, 10);
      if (!d) return;
      if (!byDay.has(d)) byDay.set(d, { n: 0, del: 0, rev: 0, conf: 0 });
      var e = byDay.get(d); e.n++;
      if (isDelivered(o)) { e.del++; e.rev += revenue(o); }
      if (isConfirmed(o)) e.conf++;
    });
    var days = Array.from(byDay.keys()).sort();
    if (!days.length) days = [iso(today())];

    /* تجميع حسب البنت/المنتج/المدينة/المصدر */
    function agg(map) {
      return Array.from(map.entries()).map(function (e) {
        var s = stats(e[1]); s.name = e[0]; return s;
      });
    }
    var agents = agg(groupBy(rows, agentKey)).filter(function (a) { return a.name !== 'Sans agente'; })
      .sort(function (a, b) { return b.rev - a.rev || b.delivered - a.delivered || b.n - a.n; });
    var prods = agg(groupBy(rows, productKey)).filter(function (p) { return p.name !== '—'; }).sort(function (a, b) { return b.rev - a.rev || b.n - a.n; });
    var cities = agg(groupBy(rows, function (o) { return String(o.ville || '').trim() || '—'; })).filter(function (c) { return c.name !== '—'; }).sort(function (a, b) { return b.n - a.n; });
    var sources = agg(groupBy(rows, function (o) { return String(o.originLead || '').trim() || 'Non renseignée'; })).sort(function (a, b) { return b.n - a.n; });

    /* produit × agent */
    var px = [];
    var pm = groupBy(rows.filter(function (o) { return productKey(o) !== '—'; }), productKey);
    pm.forEach(function (list, prod) {
      var am = groupBy(list, agentKey);
      var best = null;
      am.forEach(function (l, ag) {
        var s = stats(l); s.agent = ag;
        if (!best || s.rev > best.rev || (s.rev === best.rev && s.delivered > best.delivered)) best = s;
      });

      px.push(all);

    px.sort(function (a, b) { return b.rev - a.rev || b.n - a.n; });

    var periodLabel = r.from ? (iso(r.from) === iso(r.to) ? iso(r.to) : iso(r.from) + ' → ' + iso(r.to)) : 'Toutes les dates';

    H.push('</div>');

      '<div class="s">' + esc(periodLabel) + ' · ' + nf(st.n) + ' commandes · source : commandes CRM</div></div>' +
      '<span class="pill" style="background:rgba(255,255,255,.12);border-color:transparent;color:#fff">' +
      (prev ? 'vs période précédente' : 'tout l\'historique') + '</span></div>' +

      '</div></div></div>');

    /* ── بنات ── */

      '<p class="sec-sub">Triées par chiffre d\'affaires livré. Chaque carte est calculée sur la période sélectionnée.</p></div>' +

    H.push('</div>');

      cities.slice(0, 12).map(function (c) {
        return '<tr><td class="name" dir="auto">' + esc(c.name) + '</td><td class="num">' + nf(c.n) + '</td><td class="num">' + nf(c.delivered) + '</td>' +
          '<td class="num">' + nf(c.returned) + '</td><td class="num">' + p1(c.rateReturn) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>');
    H.push('<div class="chart"><h3>Sources</h3><p>D\'où viennent les commandes et combien se confirment.</p><div class="tw" style="border:0;box-shadow:none"><table>' +
      '<thead><tr><th>Source</th><th class="num">Cmd.</th><th class="num">Confirmées</th><th class="num">Taux conf.</th><th class="num">CA livré</th></tr></thead><tbody>' +
      sources.map(function (s) {
        return '<tr><td class="name">' + esc(s.name) + '</td><td class="num">' + nf(s.n) + '</td><td class="num">' + nf(s.confirmed) + '</td>' +
          '<td class="num">' + p1(s.rateConf) + '</td><td class="num">' + money(s.rev) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<div class="note">Dépenses publicitaires de la période : <b>' + (spend.n ? money(spend.amount) : '— aucune saisie') + '</b>' +
      (spend.n ? ' (' + spend.n + ' ligne' + (spend.n > 1 ? 's' : '') + ') · coût par commande confirmée : <b>' + (st.confirmed ? money(spend.amount / st.confirmed) : '—') + '</b>' : '') +
      '</div></div>');
    H.push('</div>');

    /* ── tunnel + appels ── */
    H.push('<div class="sec card"><div class="banner"><div><div class="t"><span class="ico">🔎</span>Tunnel de confirmation</div>' +
      '<div class="s">De la commande assignée jusqu\'à la livraison.</div></div></div><div class="card-body" style="padding:12px">');
    H.push('<div class="funnel">' + [
      ['Assignées', st.n, 100],
      ['Confirmées', st.confirmed, st.rateConf],
      ['Expédiées', st.shipped, pct(st.shipped, st.n)],
      ['Livrées', st.delivered, pct(st.delivered, st.n)]
    ].map(function (f) {
      return '<div class="fstep"><div class="l">' + f[0] + '</div><div class="v">' + nf(f[1]) + '</div>' +
        '<div class="b"><i style="width:' + Math.min(100, f[2]).toFixed(1) + '%"></i></div>' +
        '<div class="p">' + p1(f[2]) + ' des commandes</div></div>';
    }).join('') + '</div>');
    H.push('<div class="grid2" style="margin-top:12px"><div class="chart" style="border:0;box-shadow:none;padding:0">' +
      '<h3>Répartition des tentatives d\'appel</h3><p>Nombre de commandes par nombre de tentatives (statut Appel-N).</p>' +
      barChart([1, 2, 3, 4, 5, 6].map(function (i) {
        return { label: 'Appel ' + i + (i === 6 ? '+' : ''), value: tries[i] || 0, sub: nf(tries[i] || 0), color: ['#f59e0b', '#3b82f6', '#8b5cf6', '#ec4899', '#14b8a6', '#ef4444'][i - 1] };
      }), { h: 220 }) + '</div>' +
      '<div class="chart" style="border:0;box-shadow:none;padding:0"><h3>Statuts des commandes</h3><p>Répartition exacte des statuts saisis dans le CRM.</p>' +
      hbar(statusBreakdown(rows), '#0f1e35') + '</div></div>');
    H.push('<div class="note">Tout est calculé depuis les champs réels : <b>statut</b>, <b>livraison</b>, <b>prix × qte</b>, <b>commission</b>, <b>ville</b> (frais de livraison) et <b>adspend</b>.</div>');
    H.push('</div></div>');

    $('app').innerHTML = H.join('');
    $('statusTxt').textContent = 'Données chargées · ' + nf(RAW.orders.length) + ' commandes · ' + periodLabel;
    $('who').textContent = actor ? ('Connecté : ' + actor.name) : '';
  }

  function statusBreakdown(rows) {
    var m = new Map();
    rows.forEach(function (o) { var k = String(o.statut || '').trim() || 'Sans statut'; m.set(k, (m.get(k) || 0) + 1); });
    return Array.from(m.entries()).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 9).map(function (e) {
      return { label: e[0], value: e[1], sub: nf(e[1]) + ' · ' + p1(pct(e[1], rows.length)) };
    });
  }

  function kpiCard(label, value, delta, tone, sub) {
    var d = '';
    if (typeof delta === 'number' && isFinite(delta) && Math.abs(delta) > 0.05) {
      d = '<span class="delta ' + (delta >= 0 ? 'up' : 'dn') + '">' + (delta >= 0 ? '▲' : '▼') + ' ' + p1(Math.abs(delta)) + '</span>';
    }
    var money_ = /MAD/.test(String(value));
    return '<div class="kpi ' + (tone || '') + (money_ ? ' money' : '') + '"><div class="lab">' + esc(label) + '</div>' +
      '<div class="val"><span class="txt">' + value + '</span>' + d + '</div><div class="sub">' + esc(sub || '') + '</div></div>';
  }
  function delta(now, before) {
    if (before == null || before === 0) return null;
    return ((now - before) / before) * 100;
  }
  function badge(v, okAt, midAt) {
    var cls = v >= okAt ? 'ok' : v >= midAt ? 'mid' : 'bad';
    return '<span class="badge ' + cls + '">' + p1(v) + '</span>';
  }
  function miniPeriod(label, key) {
    var r = key === 'today' ? { from: today(), to: today() } : key === '7d' ? { from: addDays(today(), -6), to: today() } : { from: addDays(today(), -29), to: today() };
    var rows = RAW.orders.filter(function (o) {
      if (!inRange(o.dateCreation, r)) return false;
      if (STATE.agent && agentKey(o) !== STATE.agent) return false;
      if (STATE.product && productKey(o) !== STATE.product) return false;
      return true;
    });
    var s = stats(rows);
    return '<div class="kpi"><div class="lab">' + esc(label) + '</div><div class="val">' + nf(s.n) + '</div>' +
      '<div class="sub">' + nf(s.confirmed) + ' confirmées · ' + nf(s.delivered) + ' livrées</div>' +
      '<div style="display:flex;gap:10px;margin-top:8px;font-size:10.5px;color:var(--muted);font-weight:700">' +
      '<span>Conf. <b style="color:var(--green)">' + p1(s.rateConf) + '</b></span>' +
      '<span>Liv. <b style="color:var(--blue)">' + p1(s.rateDeliv) + '</b></span>' +
      '<span>Ret. <b style="color:var(--red)">' + p1(s.rateReturn) + '</b></span></div>' +
      '<div class="sub" style="margin-top:4px">CA ' + money(s.rev) + '</div></div>';
  }

  /* ── UI ────────────────────────────────────────────────────────────── */
  function setPeriod(p) {
    STATE.period = p;
    $('customWrap').style.display = p === 'custom' ? '' : 'none';
    [].forEach.call($('periods').children, function (b) { b.classList.toggle('on', b.dataset.p === p); });
    if (p !== 'custom') REDRAW();
  }
  function fillSelectors() {
    var agents = Array.from(new Set(RAW.orders.map(agentKey).filter(function (x) { return x !== 'Sans agente'; }))).sort();
    var prods = Array.from(new Set(RAW.orders.map(productKey).filter(function (x) { return x !== '—'; }))).sort();
    $('agentSel').innerHTML = '<option value="">Toutes les agentes</option>' +
      agents.map(function (a) { return '<option value="' + esc(a) + '">' + esc(a) + '</option>'; }).join('');
    $('productSel').innerHTML = '<option value="">Tous les produits</option>' +
      prods.map(function (a) { return '<option value="' + esc(a) + '">' + esc(a) + '</option>'; }).join('');
  }
  function exportCsv() {
    var f = filtered(), st = stats(f.rows);
    var lines = [];
    lines.push(['Rapport', 'Performance'].join(';'));
    lines.push(['Période', STATE.period, iso(f.range.from || today()), iso(f.range.to || today())].join(';'));
    lines.push(['Commandes', st.n, 'Confirmées', st.confirmed, 'Livrées', st.delivered, 'Retours', st.returned, 'CA', Math.round(st.rev), 'Marge', Math.round(st.margin)].join(';'));
    lines.push('');
    lines.push(['Agente', 'Commandes', 'Confirmées', 'Taux conf', 'Livrées', 'Taux liv', 'Retours', 'Taux retour', 'CA', 'Commission'].join(';'));
    var agents = Array.from(groupBy(f.rows, agentKey).entries()).map(function (e) { var s = stats(e[1]); s.name = e[0]; return s; })
      .sort(function (a, b) { return b.rev - a.rev; });
    agents.forEach(function (a) {
      lines.push([a.name, a.n, a.confirmed, a.rateConf.toFixed(1), a.delivered, a.rateDeliv.toFixed(1), a.returned, a.rateReturn.toFixed(1), Math.round(a.rev), Math.round(a.commission)].join(';'));
    });
    var blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'performance-' + iso(today()) + '.csv';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }

  document.addEventListener('DOMContentLoaded', function () {
    actor = session();
    if (!actor) { location.href = 'index.html'; return; }
    [].forEach.call($('periods').children, function (b) {
      b.addEventListener('click', function () { setPeriod(b.dataset.p); });
    });
    $('agentSel').addEventListener('change', function (e) { STATE.agent = e.target.value; REDRAW(); });
    $('productSel').addEventListener('change', function (e) { STATE.product = e.target.value; REDRAW(); });
    $('refresh').addEventListener('click', function () { boot(); });
    $('export').addEventListener('click', exportCsv);
    $('from').addEventListener('change', function (e) { STATE.from = e.target.value; STATE.period = 'custom'; REDRAW(); });
    $('to').addEventListener('change', function (e) { STATE.to = e.target.value; STATE.period = 'custom'; REDRAW(); });
    setPeriod('30d');
    boot();
  });

  async function boot() {
    $('statusTxt').textContent = 'Chargement…';
    try {
      await load();
      fillSelectors();
      $('agentSel').value = STATE.agent;
      $('productSel').value = STATE.product;
      REDRAW();
    } catch (e) {
      $('app').innerHTML = '<div class="err">Erreur de chargement : ' + esc(e.message) + '<br>Vérifiez la connexion puis cliquez sur « Actualiser ».</div>';
      $('statusTxt').textContent = 'Erreur';
    }
  }
})();
</script>
<script src="pv-dark-pages-sync.js" id="pv-dark-pages-js"></script>
</body>
</html>
